<html lang="en">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- Fontawesome -->
<link rel="stylesheet" href="//unpkg.com/@fortawesome/fontawesome-free/css/fontawesome.css" />
<link rel="stylesheet" href="//unpkg.com/@fortawesome/fontawesome-free/css/brands.css" />
<link rel="stylesheet" href="//unpkg.com/@fortawesome/fontawesome-free/css/regular.css" />
<link rel="stylesheet" href="//unpkg.com/@fortawesome/fontawesome-free/css/solid.css" />

<!-- Material Icons -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<link 
  rel="stylesheet"
  href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css"
  title="docsify-darklight-theme"
  type="text/css"
/>
<link 
  rel="stylesheet"
  href="./_assets/css/style.css"
  type="text/css"
/>
<style>
  .lang-select {
    position: fixed;
    top: 12px;
    right: 16px;
    z-index: 10;
    padding: 4px 8px;
    border-radius: 4px;
  }
</style>
<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover">

  <!-- Replace with your own title and description. -->
  <title>Classic Fantasy Imperative System Resource Document</title>
  <meta name="description" content="Classic Fantasy Imperative System Resource Document">

  <!-- Default Theme (see https://docsify.js.org/#/themes) -->
  <!-- <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"> -->
   
   <link rel="icon" href="_media/favicon.ico">


</head>

<body>
  <div id="app"></div>

  <!-- Language Selector -->
  <select id="language-select" class="lang-select" onchange="setDocsifyLanguage(this.value)">
    <option value="en">English</option>
    <option value="es">Español</option>
    <option value="fr">Français</option>
    <option value="it">Italiano</option>
    <option value="el">Ελληνικά</option>
    <option value="zh-CN">中文 (简体)</option>
    <option value="ar">العربية</option>
    <option value="fa">فارسی</option>
    <option value="ur">اردو</option>
    <option value="he">עברית</option>
    <option value="ps">پښتو</option>
    <option value="ku">Kurdî</option>
    <option value="dv">ދިވެހި</option>
    <option value="hi">हिन्दी</option>
    <option value="ja">日本語</option>
    <option value="ko">한국어</option>
    <option value="tr">Türkçe</option>
    <option value="vi">Tiếng Việt</option>
    <option value="ru">Русский</option>
    <option value="uk">Українська</option>
    <option value="hr">Hrvatski</option>
    <option value="sr">Српски</option>
    <option value="bs">Bosanski</option>
    <option value="sq">Shqip</option>
    <option value="mk">Македонски</option>
    <option value="sl">Slovenščina</option>
    <option value="tl">Tagalog</option>
    <option value="pt">Português</option>
    <option value="sw">Kiswahili</option>
    <option value="ha">Hausa</option>
    <option value="ms">Bahasa Melayu</option>
    <option value="th">ไทย</option>
    <option value="my">မြန်မာဘာသာ</option>
  </select>

  <script>
    // List of language folders under rules/ that Docsify content is routed to.
    // Keep in sync with TARGET_LANGUAGES in .github/scripts/translate.mjs.
    var SRD_LANGUAGES = [
      'es', 'fr', 'it', 'el', 'zh-CN', 'ar', 'fa', 'ur', 'he', 'ps', 'ku', 'dv',
      'hi', 'ja', 'ko', 'tr', 'vi', 'ru', 'uk', 'hr', 'sr', 'bs', 'sq', 'mk', 'sl',
      'tl', 'pt', 'sw', 'ha', 'ms', 'th', 'my'
    ];
    var SRD_LANG_PATTERN = SRD_LANGUAGES.join('|');

    // Switches the active documentation language by rewriting the hash route,
    // which forces Docsify to re-resolve _sidebar.md/_navbar.md/content
    // through the alias map below without losing navigation state.
    function setDocsifyLanguage(lang) {
      window.location.hash = '#/' + lang + '/';
    }

    // Pre-select the dropdown to match the language segment already in the URL.
    (function initLanguageSelect() {
      var match = window.location.hash.match(new RegExp('^#/(' + SRD_LANG_PATTERN + ')/'));
      var select = document.getElementById('language-select');
      if (select) select.value = match ? match[1] : 'en';
    })();

    // Docsify Configuration (see https://docsify.js.org/#/configuration)
    window.$docsify = {
      name: 'Menu',
      //logo: '/_media/icon.png',

      // Sidebar Configuration
      auto2top: true,
      loadSidebar: true,
      loadNavbar: true,
      maxLevel: 3,
      // Set subMaxLevel to 0 to remove automatic display of page table of contents (TOC) in Sidebar
      subMaxLevel: 3,

      // Search Plugin Configuration
      search: {
        placeholder: 'Type to search',
        noData: 'No matches found.',
        // Headline depth, 1 - 6
        depth: 3,
      },

      // Route every source/content file under rules/<lang>/, and resolve
      // _sidebar.md / _navbar.md (including nested lookups) to the correct
      // language folder. English ('en') is the default/fallback language.
      alias: {
        ['/(' + SRD_LANG_PATTERN + ')/.*/_sidebar.md']: '/rules/$1/_sidebar.md',
        ['/(' + SRD_LANG_PATTERN + ')/.*/_navbar.md']: '/rules/$1/_navbar.md',
        ['/(' + SRD_LANG_PATTERN + ')/_sidebar.md']: '/rules/$1/_sidebar.md',
        ['/(' + SRD_LANG_PATTERN + ')/_navbar.md']: '/rules/$1/_navbar.md',
        ['/(' + SRD_LANG_PATTERN + ')/(.*)']: '/rules/$1/$2',
        '/.*/_sidebar.md': '/rules/en/_sidebar.md',
        '/.*/_navbar.md': '/rules/en/_navbar.md',
        '/(.*)': '/rules/en/$1'
      }
    };
  </script>
  
  <script 
    src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"
    type="text/javascript">
  </script>

  <!-- Required -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
  <script src="https://unpkg.com/docsify-plugin-flexible-alerts"></script>

  <!-- Fontawesome -->
  <script src="//unpkg.com/docsify-fontawesome/dist/docsify-fontawesome.min.js"></script>

  <!-- Material Icons -->
  

  <!-- Recommended -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <!-- <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.js"></script> -->

  <!-- Recommended -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

</body>
</html>
