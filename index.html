<style>
  /* Language selector: rendered inside the left sidebar (under the "Menu"
     app-name heading), matching the layout used by the companion Mythras
     Imperative SRD site, instead of floating over the content area. */
  .lang-select-wrap {
    padding: 0 20px 16px;
  }
  .lang-select-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    opacity: 0.6;
    margin-bottom: 6px;
  }
  .lang-select {
    width: 100%;
    padding: 4px 8px;
    border-radius: 4px;
    box-sizing: border-box;
  }
</style>
<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover">

  <!-- Replace with your own title and description. -->
  <title>Classic Fantasy Imperative System Resource Document</title>
  <meta name="description" content="Classic Fantasy Imperative System Resource Document">

  <!-- Default Theme (see https://docsify.js.org/#/themes) -->
  <!-- <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"> -->
   
   <link rel="icon" href="_media/favicon.ico">


</head>

<body>
  <div id="app"></div>

  <!-- Language Selector. Positioned into the left sidebar (below the "Menu"
       heading) via JS once Docsify mounts - see placeLanguageSelectorInSidebar()
       below - so it matches the Mythras Imperative SRD site's layout instead
       of floating over the top-right of the content area. -->
  <div id="language-select-wrap" class="lang-select-wrap">
    <span class="lang-select-label">Language</span>
    <select id="language-select" class="lang-select" onchange="setDocsifyLanguage(this.value)">
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="it">Italiano</option>
      <option value="el">Ελληνικά</option>
      <option value="zh-CN">中文 (简体)</option>
      <option value="ar">العربية</option>
      <option value="fa">فارسی</option>
      <option value="ur">اردو</option>
      <option value="he">עברית</option>
      <option value="ps">پښتو</option>
      <option value="ku">Kurdî</option>
      <option value="dv">ދިވެހި</option>
      <option value="hi">हिन्दी</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="tr">Türkçe</option>
      <option value="vi">Tiếng Việt</option>
      <option value="ru">Русский</option>
      <option value="uk">Українська</option>
      <option value="hr">Hrvatski</option>
      <option value="sr">Српски</option>
      <option value="bs">Bosanski</option>
      <option value="sq">Shqip</option>
      <option value="mk">Македонски</option>
      <option value="sl">Slovenščina</option>
      <option value="tl">Tagalog</option>
      <option value="pt">Português</option>
      <option value="sw">Kiswahili</option>
      <option value="ha">Hausa</option>
      <option value="ms">Bahasa Melayu</option>
      <option value="th">ไทย</option>
      <option value="my">မြန်မာဘာသာ</option>
      <option value="bg">Български</option>
      <option value="bn">বাংলা</option>
      <option value="te">తెలుగు</option>
      <option value="mr">मराठी</option>
      <option value="ta">தமிழ்</option>
    </select>
  </div>

  <script>
    // List of translated language folders under rules/ that Docsify content is
    // routed to. Keep in sync with TARGET_LANGUAGES in .github/scripts/translate.mjs.
    // 'en' is handled separately below since it is the untranslated source language.
    var SRD_LANGUAGES = [
      'es', 'fr', 'it', 'el', 'zh-CN', 'ar', 'fa', 'ur', 'he', 'ps', 'ku', 'dv',
      'hi', 'ja', 'ko', 'tr', 'vi', 'ru', 'uk', 'hr', 'sr', 'bs', 'sq', 'mk', 'sl',
      'tl', 'pt', 'sw', 'ha', 'ms', 'th', 'my', 'bg', 'bn', 'te', 'mr', 'ta'
    ];
    // Full set of routable language codes, including the 'en' source language,
    // used for alias matching so '/en/...' resolves to 'rules/en/...' instead of
    // falling through to the generic default alias (which would otherwise
    // double-prefix the path as 'rules/en/en/...' and 404 forever).
    var ALL_LANGUAGES = ['en'].concat(SRD_LANGUAGES);
    var SRD_LANG_PATTERN = SRD_LANGUAGES.join('|');
    var ALL_LANG_PATTERN = ALL_LANGUAGES.join('|');
  </script>

  <script>
    // Switches the active documentation language by rewriting the hash route,
    // which forces Docsify to re-resolve _sidebar.md/_navbar.md/content
    // through the alias map below without losing navigation state.
    function setDocsifyLanguage(lang) {
      try {
        window.location.hash = '#/' + lang + '/';
      } catch (err) {
        console.error('[SRD] Failed to switch language to "' + lang + '":', err);
      }
    }

    // Pre-select the dropdown to match the language segment already in the URL.
    // Wrapped in try/catch so a parsing issue here can never block the
    // window.$docsify configuration (in the next script block) from running.
    (function initLanguageSelect() {
      try {
        var match = window.location.hash.match(new RegExp('^#/(' + SRD_LANG_PATTERN + ')/'));
        var select = document.getElementById('language-select');
        if (select) select.value = match ? match[1] : 'en';
      } catch (err) {
        console.error('[SRD] Failed to initialize language selector:', err);
      }
    })();

    // Moves the language selector (initially just a plain element in <body>)
    // into the left sidebar, directly below the "Menu" app-name heading, so
    // it's laid out the same way as the companion Mythras Imperative SRD site
    // instead of floating over the top-right of the content area. Docsify
    // re-renders the sidebar's markdown content on navigation but normally
    // leaves the app-name/header node alone; this is re-run after every route
    // change (via the doneEach hook below) as a safety net in case Docsify
    // ever fully re-creates the sidebar, and is idempotent/no-op if the
    // selector is already correctly placed.
    function placeLanguageSelectorInSidebar() {
      try {
        var wrap = document.getElementById('language-select-wrap');
        var sidebar = document.querySelector('.sidebar');
        if (!wrap || !sidebar) return;
        var appName = sidebar.querySelector('.app-name');
        if (appName) {
          if (appName.nextElementSibling !== wrap) {
            appName.insertAdjacentElement('afterend', wrap);
          }
        } else if (sidebar.firstElementChild !== wrap) {
          sidebar.insertBefore(wrap, sidebar.firstElementChild || null);
        }
      } catch (err) {
        console.error('[SRD] Failed to place language selector in sidebar:', err);
      }
    }

    // Logs a clear, descriptive console error (including the exact requested
    // URL) whenever a content/TOC fetch made by Docsify (via XMLHttpRequest)
    // fails or returns a non-2xx status, so broken paths are easy to spot in
    // DevTools instead of silently leaving the UI stuck on "Loading...".
    (function instrumentContentFetchLogging() {
      if (!window.XMLHttpRequest || window.__srdFetchLoggingInstalled) return;
      window.__srdFetchLoggingInstalled = true;
      var originalOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url) {
        try {
          this.addEventListener('load', function () {
            if (this.status === 0 || this.status >= 400) {
              console.error('[SRD] Failed to load content (status ' + this.status + '): ' + url);
            }
          });
          this.addEventListener('error', function () {
            console.error('[SRD] Network error while loading content: ' + url);
          });
        } catch (err) {
          console.error('[SRD] Fetch instrumentation error for URL ' + url + ':', err);
        }
        return originalOpen.apply(this, arguments);
      };
    })();

    // Docsify Configuration (see https://docsify.js.org/#/configuration)
    // Assigning this in its own try/catch, after the (already-guarded) setup
    // above, guarantees Docsify always receives a valid config even if some
    // unrelated helper above misbehaves.
    try {
      window.$docsify = {
        name: 'Menu',
        //logo: '/_media/icon.png',

        // Explicit fallback: if no language/file is specified in the URL
        // (empty hash), load the English README - the first entry in the
        // TOC/_sidebar.md manifest - instead of hanging indefinitely.
        homepage: 'README.md',

        // Show a friendly, on-screen "not found" message (see _404.md) with a
        // retry link instead of leaving the "Loading..." spinner stuck forever
        // when a markdown file genuinely can't be found (e.g. a translation
        // that hasn't been generated for a given language yet).
        notFoundPage: true,

        // Sidebar Configuration
        auto2top: true,
        loadSidebar: true,
        loadNavbar: true,
        maxLevel: 3,
        // Set subMaxLevel to 0 to remove automatic display of page table of contents (TOC) in Sidebar
        subMaxLevel: 3,

        // Search Plugin Configuration
        search: {
          placeholder: 'Type to search',
          noData: 'No matches found.',
          // Headline depth, 1 - 6
          depth: 3,
        },

        // Places the language selector inside the left sidebar (below the
        // "Menu" app-name heading) once Docsify mounts, and again after every
        // route change, so it stays in the same spot as the companion
        // Mythras Imperative SRD site instead of floating over the content.
        plugins: [
          function (hook) {
            hook.mounted(placeLanguageSelectorInSidebar);
            hook.doneEach(placeLanguageSelectorInSidebar);
          },
        ],

        // Route every source/content file under rules/<lang>/, and resolve
        // _sidebar.md / _navbar.md (including nested lookups) to the correct
        // language folder. All alias targets are relative (no leading "/"),
        // so they resolve against Docsify's own base path rather than the
        // domain root - this is required for the site to work correctly when
        // hosted on GitHub Pages project sites or any other custom subpath.
        // 'en' is included in the language-prefixed rules (not just the
        // generic fallback) so that '/en/...' resolves to 'rules/en/...'
        // instead of incorrectly doubling up to 'rules/en/en/...'.
        alias: {
          ['/(' + ALL_LANG_PATTERN + ')/.*/_sidebar.md']: 'rules/$1/_sidebar.md',
          ['/(' + ALL_LANG_PATTERN + ')/.*/_navbar.md']: 'rules/$1/_navbar.md',
          ['/(' + ALL_LANG_PATTERN + ')/_sidebar.md']: 'rules/$1/_sidebar.md',
          ['/(' + ALL_LANG_PATTERN + ')/_navbar.md']: 'rules/$1/_navbar.md',
          ['/(' + ALL_LANG_PATTERN + ')/(.*)']: 'rules/$1/$2',
          '/.*/_sidebar.md': 'rules/en/_sidebar.md',
          '/.*/_navbar.md': 'rules/en/_navbar.md',
          '/(.*)': 'rules/en/$1'
        }
      };
    } catch (err) {
      console.error('[SRD] Failed to initialize Docsify configuration:', err);
    }
  </script>
  
  <script 
    src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"
    type="text/javascript">
  </script>

</body>
